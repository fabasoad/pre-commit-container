---
name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*.*.*"

defaults:
  run:
    shell: sh

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository }}"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - name: Get tool versions
        id: versions
        run: |
          {
            echo "actionlint=$(sh ./scripts/get-tool-version.sh -t actionlint)"
            echo "go=$(sh ./scripts/get-tool-version.sh -t golang)"
            echo "hadolint=$(sh ./scripts/get-tool-version.sh -t hadolint)"
            echo "pre-commit=$(sh ./scripts/get-tool-version.sh -t pre-commit)"
            echo "terraform=$(sh ./scripts/get-tool-version.sh -t terraform)"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "."
          build-args: |
            ACTIONLINT_VERSION=${{ steps.versions.outputs.actionlint }}
            GO_VERSION=${{ steps.versions.outputs.go }}
            HADOLINT_VERSION=${{ steps.versions.outputs.hadolint }}
            TERRAFORM_VERSION=${{ steps.versions.outputs.terraform }}
          file: src/Dockerfile
          push: "true"
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
  create-release:
    name: Create release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: "false"
      - name: Get changelog
        id: changelog
        uses: simbo/changes-since-last-release-action@45883b23a1c40599d6967b447b919a5663aaf23d # v1.0.1
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            # Changelog

            ${{ steps.changelog.outputs.log }}

            ---

            [ghcr.io/fabasoad/pre-commit-container:${{ github.ref_name }}](https://github.com/fabasoad/pre-commit-container/pkgs/container/pre-commit-container)
          draft: false
          prerelease: false
