---
name: Release

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*.*.*"

defaults:
  run:
    shell: sh

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository }}"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Get tool versions
        id: versions
        run: |
          {
            echo "actionlint=$(sh ./scripts/get-tool-version.sh -t actionlint)"
            echo "go=$(sh ./scripts/get-tool-version.sh -t golang)"
            echo "hadolint=$(sh ./scripts/get-tool-version.sh -t hadolint)"
            echo "npm=$(sh ./scripts/get-tool-version.sh -t npm)"
            echo "pre-commit=$(sh ./scripts/get-tool-version.sh -t pre-commit)"
            echo "terraform=$(sh ./scripts/get-tool-version.sh -t terraform)"
            echo "tflint=$(sh ./scripts/get-tool-version.sh -t tflint)"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "."
          build-args: |
            ACTIONLINT_VERSION=${{ steps.versions.outputs.actionlint }}
            GO_VERSION=${{ steps.versions.outputs.go }}
            HADOLINT_VERSION=${{ steps.versions.outputs.hadolint }}
            NPM_VERSION=${{ steps.versions.outputs.npm }}
            TERRAFORM_VERSION=${{ steps.versions.outputs.terraform }}
            TFLINT_VERSION=${{ steps.versions.outputs.tflint }}
          file: src/Dockerfile
          push: "true"
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
  create-release:
    name: Create release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: "false"
      - name: Get changelog
        id: changelog
        uses: simbo/changes-since-last-release-action@45883b23a1c40599d6967b447b919a5663aaf23d # v1.0.1
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            # Changelog

            ${{ steps.changelog.outputs.log }}

            ---

            [ghcr.io/fabasoad/pre-commit-container:${{ github.ref_name }}](https://github.com/fabasoad/pre-commit-container/pkgs/container/pre-commit-container)
          draft: false
          prerelease: false
